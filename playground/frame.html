    <title>WallKit Frame Proof</title>

      html,
      body {
        margin: 0;
        background: #0b0e14;
      }
    </style>

  <body>
    <!--
      Frame proof page. A viewfinder is a full-picture overlay, so this page is
      a single stage rather than a grid of sample cards: the only honest way to
      judge the gutters, the line weight and the readout positions is to see
      them at wallpaper size.

      No Wallpaper Engine bridge is needed — nothing here is data. To look at it
      inside the engine, point `project.json` → "file" at `frame.html`;
      `build:wallpaper` emits it next to `wallpaper.html` and `layout.html`.
    -->
    <div id="root"></div>
    <script type="module" src="./frame.jsx"></script>
  </body>
